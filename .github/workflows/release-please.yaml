name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Propose release
    runs-on: ubuntu-latest
    steps:
      # App credentials come from 1Password at runtime (single source of truth in
      # the Automation vault). Only OP_SERVICE_ACCOUNT_TOKEN lives as a repo secret;
      # the app id + private key never leave 1Password.
      #
      # The item is addressed by its UUID, not its title. Titles are mutable: this
      # reference previously read "rubicon-release-please-private-key" and every
      # release run started failing the moment the item was renamed. A UUID cannot
      # drift that way. It identifies the rubicon-release-please GitHub App key and
      # is an address, not a secret.
      - name: Load app credentials from 1Password
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
          version: 2.35.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          RELEASE_PLEASE_CLIENT_ID: 'op://Automation/lnacky4l2tmlihrockbutkub7y/client id'
          RELEASE_PLEASE_APP_KEY: 'op://Automation/lnacky4l2tmlihrockbutkub7y/private key'

      - name: Mint app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ steps.op.outputs.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.RELEASE_PLEASE_APP_KEY }}

      - name: Run release-please
        uses: googleapis/release-please-action@5792afc6b46e9bb55deda9eda973a18c226bc3fc # v4.1.5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
